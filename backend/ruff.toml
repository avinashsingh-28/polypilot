line-length = 130
target-version = "py312"
extend-exclude = ["venv", "alembic/versions"]

[lint]
# Correctness-focused rules; style is not enforced on existing code.
select = ["E9", "F63", "F7", "F82", "F401", "F811", "F841", "B006", "B008", "S105", "S106", "S108", "S307", "S602", "S604", "S605"]
ignore = ["B008"]   # FastAPI Depends() defaults

[lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S108", "F841"]
"app/models/__init__.py" = ["F401"]
"app/services/*/__init__.py" = ["F401"]
"app/models/*" = ["F821"]                       # SQLAlchemy string forward references
"app/services/sandbox/driver.py" = ["S108"]     # container tmpfs mount, not a host temp file
"sandbox/harness.py" = ["S108"]                 # HOME inside the sandbox container
