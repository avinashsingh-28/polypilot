# Manual production deployment to a single Docker VM over SSH.
# Never runs automatically. Configure the "production" environment in
# GitHub → Settings → Environments with required reviewers and these secrets:
#   DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY, DEPLOY_KNOWN_HOSTS, DEPLOY_PATH
# The server keeps its own deploy/.env.prod; no application secrets live in GitHub.
name: Deploy (manual)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git tag or commit SHA to deploy (must already have passed CI)"
        required: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 30
    steps:
      - name: Refuse untagged branch names
        run: |
          case "${{ inputs.ref }}" in
            v*|[0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]*) ;;
            *) echo "Deploy a release tag (v*) or a commit SHA"; exit 1;;
          esac
      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      - name: Back up database, then deploy
        env:
          REF: ${{ inputs.ref }}
        run: |
          ssh -i ~/.ssh/id_deploy "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" bash -se <<EOF
          set -euo pipefail
          cd "${{ secrets.DEPLOY_PATH }}"
          ./deploy/backup.sh
          git fetch --tags origin
          git checkout --detach "$REF"
          docker build -t polypilot-sandbox:latest backend/sandbox
          docker compose -f docker-compose.prod.yml --env-file deploy/.env.prod up -d --build
          sleep 20
          curl -fsS http://127.0.0.1:8080/health/ready
          curl -fsS http://127.0.0.1:8080/health/worker
          EOF
