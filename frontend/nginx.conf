server {
    listen 8080;
    server_name _;
    server_tokens off;
    client_max_body_size 8m;
    root /usr/share/nginx/html;

    # Security headers live in an include: nginx drops server-level add_header in any location
    # that sets its own header, so every location must include them explicitly.
    include /etc/nginx/conf.d/security-headers.inc;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
    }
    location = /health { proxy_pass http://backend:8000; proxy_hide_header X-Frame-Options; proxy_hide_header X-Content-Type-Options; proxy_hide_header Referrer-Policy; }
    location /health/ { proxy_pass http://backend:8000; proxy_hide_header X-Frame-Options; proxy_hide_header X-Content-Type-Options; proxy_hide_header Referrer-Policy; }
    # /metrics, /docs and the database are intentionally not exposed through the proxy.

    location /assets/ {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location / {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
